server:
  port: 8081

spring:
  application:
    name: shipment-service
  datasource:
    url: jdbc:h2:mem:shipment;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs

logging:
  level:
    com.shippingontheair: INFO
