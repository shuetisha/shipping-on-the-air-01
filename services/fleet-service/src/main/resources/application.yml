server:
  port: 8082

spring:
  application:
    name: fleet-service
  datasource:
    url: jdbc:h2:mem:fleet;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs

logging:
  level:
    com.shippingontheair: INFO
