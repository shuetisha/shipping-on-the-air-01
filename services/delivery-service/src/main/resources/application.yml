server:
  port: 8083

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:h2:mem:delivery;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

shipment-service:
  url: http://localhost:8081

fleet-service:
  url: http://localhost:8082

delivery:
  simulation:
    tick-ms: 3000
    speed-km-per-hour: 36

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs

logging:
  level:
    com.shippingontheair: INFO
